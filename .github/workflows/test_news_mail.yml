name: 朝刊メールをテスト送信

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test-mail:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: リンク一覧を生成
        run: python scripts/generate_links.py

      - name: 朝刊メールを送信
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          SMTP_USE_SSL: "true"
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.SMTP_USERNAME }}
        run: |
          if [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "SMTP関連のGitHub Secretsが未設定です。"
            exit 1
          fi
          python scripts/send_news_mail.py
